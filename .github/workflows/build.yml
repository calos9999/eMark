name: Build eMark

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]
  workflow_dispatch:

jobs:
  build-emarkd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies for eMarkd
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev libdb++-dev libboost-all-dev \
            libprotobuf-dev libqrencode-dev libminiupnpc-dev

      - name: Build eMarkd with max optimization & strip
        run: |
          cd src
          make -f makefile.unix -j$(nproc) \
            CXXFLAGS="-O3 -DNDEBUG -Wall" \
            LDFLAGS="-s"
          mkdir -p ../output
          cp eMarkd ../output/
          strip --strip-all ../output/eMarkd

      - name: Upload eMarkd artifact
        uses: actions/upload-artifact@v4
        with:
          name: eMarkd
          path: output/eMarkd

  build-emark-qt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies for eMark-qt (Qt5)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt5-qmake qtbase5-dev qttools5-dev qttools5-dev-tools \
            libqt5gui5 libqt5core5a libqt5network5 libqt5widgets5 \
            libboost-dev libboost-thread-dev libboost-program-options-dev \
            libboost-filesystem-dev libboost-system-dev libdb++-dev \
            libminiupnpc-dev libssl-dev

      - name: Build eMark-qt with max optimization & strip
        run: |
          qmake eMark-qt.pro "CONFIG+=release" "QMAKE_CXXFLAGS+=-O3 -DNDEBUG"
          make -j$(nproc)
          mkdir -p output
          cp eMark-qt output/
          strip --strip-all output/eMark-qt

      - name: Upload eMark-qt artifact
        uses: actions/upload-artifact@v4
        with:
          name: eMark-qt
          path: output/eMark-qt
